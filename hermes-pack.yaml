# Hermes plugin pack for Polytropos. Install with: hermes plugins pack install hermes-pack.yaml
# The refs of the two Lil-Clanky/polytropos entries are written by scripts/release.py at release time.
# The polymetis ref moves with: python scripts/release.py --repo Lil-Clanky/polymetis --sha <commit>
# The ponytail and superpowers refs follow versions.lock.
# Hermes refuses ponytail's plugin.json, on v0.23.2 and later, so the pack install reports the ponytail entry as
# failed. `hermes polytropos install` tries `hermes plugins install`, which Hermes refuses the same way.
name: polytropos
description: Model routing, FreeLLMAPI and token savings for Hermes Agent
author: Lil-Clanky
version: 0.3.0
plugins:
  - repo: Lil-Clanky/polytropos
    ref: f9eb8ce4ef0e59e4f04d60f256c4732e5a7bd7df
    subdir: plugins/polytropos
  - repo: Lil-Clanky/polytropos
    ref: f9eb8ce4ef0e59e4f04d60f256c4732e5a7bd7df
    subdir: plugins/polytropos_router
  - repo: Lil-Clanky/polymetis
    ref: 0885db43f32d7d1db7558add410708532ed058f5
  - repo: DietrichGebert/ponytail
    ref: 7801d061243d7b753bad0e0b3c057cd250b11755
  - repo: obra/superpowers
    ref: 22f0b463e7a5e579904dd6211a520321035526f7
config:
  polytropos-router:
    default_route: complex
skills: []
